services:
  db:
    image: mysql:26.7
    container_name: gym-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Necesario para el evento de purga de admin_logs (migración 005)
      - --event-scheduler=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gym}
      MYSQL_USER: ${MYSQL_USER:?define MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?define MYSQL_PASSWORD en .env}
    ports:
      # 3307 en el host para no chocar con un MySQL instalado localmente
      - '${MYSQL_PORT:-3307}:3306'
    volumes:
      - gym-db-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-u',
          'root',
          '-p$$MYSQL_ROOT_PASSWORD',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  gym-db-data:
    name: gym-db-data
